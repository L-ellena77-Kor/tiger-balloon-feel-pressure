<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>압력 골렘의 봉인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d1020;--panel:#171b31;--panel2:#20253f;--line:#2f3660;--text:#eef0ff;--muted:#9ea6cc;--gold:#ffd166;--green:#4ade80;--red:#f87171;--blue:#60a5fa;--purple:#c084fc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:17px;line-height:1.5}
body{background:radial-gradient(1200px 600px at 70% -10%,#2a1f5a 0,transparent 60%),var(--bg);min-height:100vh}
h1,h2,h3,.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;margin:0}
.wrap{max-width:1300px;margin:0 auto;padding-block:14px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card+.card{margin-top:12px}
.muted{color:var(--muted)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;background:#3a4172;color:var(--text);cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.18)}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none}
.btn.primary{background:linear-gradient(135deg,#7c3aed,#2563eb)}
.btn.gold{background:#a16207}.btn.green{background:#15803d}.btn.red{background:#b91c1c}.btn.blue{background:#1d4ed8}
.btn.big{font-size:21px;padding:15px 24px}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:minmax(330px,440px) 1fr;gap:14px;align-items:start}
@media(max-width:920px){.grid{grid-template-columns:1fr}}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stg{padding:5px 11px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:14px;white-space:nowrap}
.stg.now{background:#7c3aed;color:#fff}.stg.done{background:#14532d;color:#bbf7d0}
/* map */
.roof{text-align:center;font-family:Jua,'Noto Sans KR',sans-serif;font-size:18px;color:var(--gold);margin-bottom:8px}
.floor{display:flex;gap:8px;margin-bottom:8px}
.flabel{width:46px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;background:var(--panel2);border-radius:10px;text-align:center;line-height:1.2}
.tile{flex:1;min-height:68px;border-radius:12px;padding:8px 10px;background:#262c4c;border:2px solid transparent;cursor:pointer;position:relative;text-align:left;color:var(--text);font:inherit}
.tile:hover{filter:brightness(1.15)}
.tile.target{background:#3c2a6e;border-color:#8b5cf6}
.tile.solved{background:#15392a}
.tile.locked{opacity:.6}
.tile.out{background:#1b3a28}
.tile.here{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.28)}
.tname{font-family:Jua,'Noto Sans KR',sans-serif;font-size:20px;white-space:nowrap}
.tneed{font-size:13px;color:var(--muted);white-space:nowrap}
.avs{font-size:20px;letter-spacing:2px;min-height:24px}
.badge{position:absolute;top:6px;right:8px;font-size:17px}
.ground{border-top:3px dashed #3f6b4a;padding-top:8px}
/* team */
.mem{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border:0}
.mem .ic{font-size:24px;width:30px;text-align:center}
.mem .nm{font-weight:700;white-space:nowrap}
.mem .lc{font-size:14px;color:var(--muted);white-space:nowrap}
.mem .hp{margin-left:auto;white-space:nowrap}
.me-tag{font-size:12px;background:#a16207;border-radius:6px;padding:1px 6px;margin-left:4px}
.items{display:flex;gap:8px;flex-wrap:wrap}
.log div{font-size:14px;color:var(--muted);padding:3px 0;border-bottom:1px dashed var(--line)}
/* station */
.st-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.st-emoji{font-size:44px}
.st-title{font-size:28px}
.concept{display:inline-block;font-size:14px;background:#4c1d95;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.clue{background:#3b2f0c;border:2px solid #a16207;border-radius:14px;padding:14px;margin:10px 0;font-size:19px}
.ok{background:#14361f;border:2px solid #15803d;border-radius:14px;padding:12px;margin:10px 0}
.warn{background:#3f1d1d;border:2px solid #b91c1c;border-radius:14px;padding:12px;margin:10px 0}
.msg{background:#3a1f12;border:2px solid #c2410c;border-radius:14px;padding:12px;margin:10px 0}
.hintbox{background:#0f3a33;border:2px dashed #2dd4bf;border-radius:14px;padding:12px;margin:10px 0}
.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.choice{font:inherit;color:var(--text);background:#2a3156;border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px}
.choice:hover:not(:disabled){border-color:#a78bfa}
.choice:disabled{opacity:.4;cursor:not-allowed}
.duty{display:inline-block;background:#1e3a8a;border-radius:8px;padding:2px 10px;font-size:15px;margin:2px 4px 2px 0}
canvas.sim{width:100%;max-width:420px;display:block;margin:6px auto;background:#0b0e1c;border-radius:14px;border:1px solid var(--line)}
.bees{position:relative;height:0}
.bee{position:absolute;font-size:28px;animation:buzz 6s linear infinite}
@keyframes buzz{0%{transform:translate(0,0)}25%{transform:translate(60px,30px)}50%{transform:translate(10px,70px)}75%{transform:translate(-50px,25px)}100%{transform:translate(0,0)}}
table.bt{border-collapse:collapse;margin:10px auto;font-size:19px}
table.bt td,table.bt th{border:2px solid #4b5394;padding:8px 10px;text-align:center;min-width:72px}
table.bt th{background:#2a3156;font-weight:700}
table.bt input{width:66px;font:inherit;text-align:center;border-radius:8px;border:2px solid #8b5cf6;background:#0b0e1c;color:var(--text);padding:4px}
.golem{font-size:80px;text-align:center;line-height:1}
.hpbar{height:16px;background:#3b0d0d;border-radius:8px;overflow:hidden;max-width:300px;margin:6px auto}
.hpbar>i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f97316)}
/* overlay */
#overlay .back{position:fixed;inset:0;background:rgba(5,6,15,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:2px solid #8b5cf6;border-radius:18px;padding:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.modal h2{font-size:26px;margin-bottom:8px}
.ox{display:flex;gap:14px;justify-content:center;margin-top:12px}
.ox .btn{font-size:30px;min-width:110px}
#musicBox{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:8px;background:rgba(23,27,49,.92);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
#musicBox input{width:110px;accent-color:#a78bfa}
#musicBtn.on{background:#6d28d9}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#312e81;border:2px solid #8b5cf6;padding:10px 18px;border-radius:12px;z-index:80;font-weight:700;display:none;max-width:90vw;text-align:center}
/* entry */
.entry{max-width:760px;margin:30px auto}
.entry.wide{max-width:1240px;margin:16px auto}
.big-title{font-size:44px;text-align:center;background:linear-gradient(90deg,#fbbf24,#f472b6,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
select{font:inherit;padding:9px 12px;border-radius:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:10px;padding:0 10px 10px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcard{--c:#a78bfa;font:inherit;color:var(--text);text-align:left;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;border:2px solid color-mix(in srgb,var(--c) 35%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,#141830),#12162a 70%);transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.pcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.pcard.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent),0 10px 30px color-mix(in srgb,var(--c) 25%,transparent);transform:translateY(-4px)}
.pcard.taken{opacity:.62}
.pc-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;color:color-mix(in srgb,var(--c) 70%,#fff)}
.pc-top i{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 60%,transparent)}
.pcard.sel .pc-top i{background:var(--c)}
.pc-art{border-radius:12px;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--c) 38%,transparent),transparent 68%),#0c0f20;aspect-ratio:200/210;overflow:hidden;max-width:100%}
.pc-art svg{width:100%;height:100%;display:block}
.pc-title{font-size:13px;color:color-mix(in srgb,var(--c) 75%,#fff)}
.pc-name{font-family:Jua,'Noto Sans KR',sans-serif;font-size:28px;line-height:1.05;white-space:nowrap}
.pc-name small{font-family:'Noto Sans KR',sans-serif;font-size:11px;letter-spacing:.14em;color:var(--muted);margin-left:6px}
.pc-skill{align-self:flex-start;font-size:13px;font-weight:700;padding:3px 9px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:color-mix(in srgb,var(--c) 80%,#fff);white-space:nowrap}
.pc-desc{margin:0;font-size:13.5px;line-height:1.45;color:#cfd4ee;min-height:3.9em}
.pc-stats{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:12px;color:var(--muted)}
.pc-stats b{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c) var(--v),#2a3156 var(--v))}
.pc-owner{margin-top:2px;border-top:1px dashed color-mix(in srgb,var(--c) 40%,transparent);padding-top:7px;font-family:Jua,'Noto Sans KR',sans-serif;font-size:22px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:38px;color:color-mix(in srgb,var(--c) 60%,#fff)}
.pc-owner.empty{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--muted)}
.namebox{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px}
.namebox input{font:inherit;font-size:22px;font-family:Jua,'Noto Sans KR',sans-serif;width:200px;text-align:center;padding:9px 12px;border-radius:12px;border:2px solid #8b5cf6;background:#0b0e1c;color:var(--text)}
.portrait{display:inline-block;width:42px;height:42px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c) 45%,transparent),#0c0f20 75%);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);overflow:hidden}
.portrait svg{width:100%;height:100%;display:block}
.record{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:10px;margin-top:12px}
@media(max-width:640px){.record{grid-template-columns:repeat(2,minmax(0,1fr))}}
.record .pc-owner{font-size:26px;order:-1;border:0;padding:0;min-height:0;margin:-2px 0 2px}
.record .deeds{font-size:13px}
.record .pcard{cursor:default}
.record .pcard:hover{transform:none}
.deeds{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.4}
.deeds li{background:rgba(255,255,255,.04);border-radius:8px;padding:5px 8px}
.memo{text-align:center;font-family:Jua,'Noto Sans KR',sans-serif;font-size:24px;line-height:1.6;margin:18px 0 6px;color:#fde68a}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
.rolebtn{font:inherit;color:var(--text);background:#262c4c;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:center}
.rolebtn.sel{border-color:#fbbf24;background:#3b2f0c}
.rolebtn .ri{font-size:36px}
.rolebtn small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.rolebtn.taken{opacity:.55}
.banner{background:#422006;border:1px solid #a16207;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.chest{font-size:90px;text-align:center;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-12px)}}
table.rank{width:100%;border-collapse:collapse;margin-top:8px}
table.rank td,table.rank th{border-bottom:1px solid var(--line);padding:7px;text-align:center;white-space:nowrap}
/* intro */
.intro{max-width:1040px;margin:10px auto}
.intro h2{font-size:26px;margin:4px 0 10px}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
.step{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px}
.step .no{flex:none;width:36px;height:36px;border-radius:50%;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-family:Jua,'Noto Sans KR',sans-serif;font-size:20px}
.step b{display:block;font-size:18px;margin-bottom:2px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;margin:6px 0}
.route .rt{background:#262c4c;border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center;white-space:nowrap}
.route .rt small{display:block;color:var(--muted);font-size:13px}
.route .ar{color:var(--gold);font-size:22px}
.rolegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:760px){.rolegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rolegrid div{background:#262c4c;border-radius:12px;padding:10px;text-align:center;font-size:14px;color:var(--muted)}
.rolegrid div span{display:block;font-size:30px}
.rolegrid div b{display:block;color:var(--text);font-family:Jua,'Noto Sans KR',sans-serif;font-size:19px;font-weight:400}
.danger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:760px){.danger{grid-template-columns:1fr}}
.danger div{background:#2b1d2e;border:1px solid #6b2b4a;border-radius:12px;padding:10px 12px;font-size:15px}
.danger div b{display:block;font-size:17px}
.guide{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;padding:11px 14px;border-radius:14px;margin-bottom:10px;background:#2b2140;border:2px solid #8b5cf6}
.guide.go{background:#3b2f0c;border-color:#f59e0b}.guide.turn{background:#3b2f0c;border-color:#fbbf24}.guide.talk{background:#0f3a33;border-color:#2dd4bf}.guide.wait{background:#1f2440;border-color:#64748b}
@keyframes turn{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.75)}50%{box-shadow:0 0 0 7px rgba(251,191,36,0)}}
.myturn{animation:turn 1.5s ease-in-out infinite;outline:2px solid #fbbf24;outline-offset:1px}
.tile.go{border-color:#fbbf24;animation:turn 1.5s ease-in-out infinite}
.gotag{position:absolute;right:8px;bottom:6px;background:#f59e0b;color:#1c1203;font-weight:900;font-size:13px;border-radius:8px;padding:1px 7px;white-space:nowrap}
.numgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 4px}
.numgrid .btn{min-width:64px;font-size:20px;font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400}
.numgrid .btn.on{background:linear-gradient(135deg,#7c3aed,#2563eb);box-shadow:0 0 0 3px rgba(167,139,250,.5)}
.cards .pcard{transform:rotate(calc((var(--i,2) - 2) * 1.6deg)) translateY(calc(var(--d,0) * 6px))}
.cards .pcard.sel{transform:translateY(-10px)}
.cards .pcard:not(.sel):not(.taken):hover{transform:translateY(-8px)}
@keyframes spread{from{opacity:0;transform:translateX(calc((2 - var(--i,2)) * 104%)) translateY(24px) scale(.9)}35%{opacity:1}}
.cards.deal .pcard{animation:spread .8s cubic-bezier(.2,.8,.25,1.08) both;animation-delay:calc(var(--i,0) * .07s)}
@media(max-width:1100px){.cards .pcard{transform:none}.cards.deal .pcard{animation-name:deal}}
@keyframes deal{from{opacity:0;transform:translateY(30px) scale(.94)}}
@keyframes mspin{from{transform:perspective(600px) rotateY(0)}to{transform:perspective(600px) rotateY(360deg)}}
.pcard[data-role="mage"]:hover .pc-art svg,.pcard[data-role="mage"].pick .pc-art svg{animation:mspin 1.1s ease-in-out}
.cards.deal .pcard[data-role="mage"] .pc-art svg{animation:mspin 1.1s 1s ease-in-out}
.story{max-width:760px;margin:6px auto 0;text-align:center;font-size:18px;line-height:1.75;color:#d8dcf2}
.story b{color:#fde68a}
.login{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;font-family:Jua,'Noto Sans KR',sans-serif;font-size:24px;margin:16px 0 4px}
.login select{font-family:inherit;font-size:24px;padding:4px 10px;border:2px solid #8b5cf6;border-radius:10px}
@keyframes pick{0%{transform:perspective(800px) rotateY(0) scale(1)}45%{transform:perspective(800px) rotateY(180deg) scale(1.06)}100%{transform:perspective(800px) rotateY(360deg) translateY(-4px)}}
.pcard.pick{animation:pick .6s ease-in-out}
.pcard:not(.sel):not(.taken):hover{transform:translateY(-4px) rotate(-1deg)}
.seats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}
@media(max-width:640px){.seats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.seat{--c:#64748b;border-radius:14px;padding:10px 6px;text-align:center;border:2px dashed #3b4270;color:var(--muted)}
.seat.in{border:2px solid var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 12%,transparent)}
.seat .portrait{display:block;width:72px;height:72px;margin:0 auto 6px}
.seat b{display:block;font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
@media(max-width:640px){.big3{grid-template-columns:1fr}}
.big3 div{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.big3 span{display:block;font-size:44px}
.big3 b{display:block;font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400;font-size:23px;margin:4px 0}
@media (prefers-reduced-motion: reduce){.myturn,.tile.go,.cards.deal .pcard,.pcard.pick,.chest,.pc-art svg{animation:none!important}}
footer{text-align:center;color:#6b739c;font-size:12px;margin-top:8px}
.golemBox{position:relative}
.party{position:relative;width:min(760px,96vw);height:min(600px,92vh);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.partyTxt{font-size:40px;color:#fde68a;text-shadow:0 0 18px rgba(251,191,36,.6);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;z-index:3}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:fall linear infinite}

const INC = n => ({__inc:n});
const NOW = {__now:true};   // 서버 시계로 기록
function makeFirebase(){
  {
    firebase.initializeApp(FIREBASE_CONFIG);
    const d = firebase.database(), A = firebase.auth();
    const conv = o => { const r = {}; for (const k in o) { const v = o[k]; r[k] = (v && typeof v === 'object' && '__inc' in v) ? firebase.database.ServerValue.increment(v.__inc) : (v && typeof v === 'object' && v.__now) ? firebase.database.ServerValue.TIMESTAMP : (v === undefined ? null : v); } return r; };
    let ready = null;
    const ensure = () => {
      if (A.currentUser) return Promise.resolve(A.currentUser.uid);
      if (!ready) ready = new Promise((res, rej) => { const off = A.onAuthStateChanged(u => { if (u) { off(); ready = null; res(u.uid); } }); A.signInAnonymously().catch(e => { off(); ready = null; rej(e); }); });
      return ready;
    };
    return {
      mode:'firebase',
      ensure, uidNow:() => A.currentUser ? A.currentUser.uid : null,
      async google(){ const r = await A.signInWithPopup(new firebase.auth.GoogleAuthProvider()); return r.user && r.user.email; },
      signOut(){ return A.signOut(); },
      watch(p, cb){ const ref = d.ref(p); const h = s => cb(s.val()); ref.on('value', h, e => console.warn('읽기 거절', p, e && e.code)); return () => ref.off('value', h); },
      update(p, o){ return (p ? d.ref(p) : d.ref()).update(conv(o)); },
      push(p, v){ return d.ref(p).push(v); },
      get(p){ return d.ref(p).once('value').then(s => s.val()); },
      remove(p){ return d.ref(p).remove(); }
    };
  }
}
function makeLocal(KEY){
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
  let root = load();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(root)); } catch(e){} };
  const parts = p => p.split('/').filter(Boolean);
  const getAt = p => { let o = root; for (const k of parts(p)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : o; };
  const setAt = (p, v) => { const ks = parts(p); let o = root; for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; } const last = ks[ks.length-1]; if (v === null || v === undefined) delete o[last]; else o[last] = v; };
  const watchers = new Set();
  const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
  const notify = () => { for (const w of watchers) w.cb(clone(getAt(w.p))); };
  window.addEventListener('storage', e => { if (e.key === KEY) { root = load(); notify(); } });
  const api = {
    mode:'local',
    ensure(){ return Promise.resolve(api.uidNow()); },
    uidNow(){ let u = null; try { u = sessionStorage.getItem('pq_uid'); } catch(e){} if (!u) { u = 'L' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('pq_uid', u); } catch(e){} } return u; },
    async google(){ return TEACHER_EMAIL; }, signOut(){ return Promise.resolve(); },
    watch(p, cb){ const w = {p, cb}; watchers.add(w); setTimeout(() => cb(clone(getAt(p))), 0); return () => watchers.delete(w); },
    update(p, o){ root = load(); for (const k in o) { const v = o[k]; const full = p + '/' + k; if (v && typeof v === 'object' && '__inc' in v) setAt(full, (Number(getAt(full)) || 0) + v.__inc); else if (v && typeof v === 'object' && v.__now) setAt(full, Date.now()); else setAt(full, clone(v)); } save(); notify(); return Promise.resolve(); },
    push(p, v){ const id = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); return api.update(p, {[id]: v}); },
    get(p){ root = load(); return Promise.resolve(clone(getAt(p))); },
    remove(p){ root = load(); setAt(p, null); save(); notify(); return Promise.resolve(); }
  };
  return api;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  const free = ['fullscreen','skipBoss','partyEnd','fire','tAddT','tDelT','resume','forget','tLockToggle','trialHidden','tFree','tClose','exitTrial','pickNum','toCards','toGroup','dice','music','toEntry','help','helpClose','quickDemo','switchRole','demoReset','potion','leave','trollClose','pickRole','enter','teacher','tBack','tResetGroup','tResetClass'];
  if (me && room && isStunned(me.role) && !free.includes(act)) return toast('😵 기절 중이야! 물약을 쓰거나 힐러를 기다려');
  ACT[act] && ACT[act](b.dataset, b);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'tEmail') ACT.tAddT();
});

  if (e.target.id === 'selCls' || e.target.id === 'selGrp') {
    entry.cls = +$('#selCls').value; entry.grp = +$('#selGrp').value; watchEntry();
  }
  if (e.target.id === 'tCls') { teacher.cls = +e.target.value; watchTeacher(); }
});

/* ===================== 그림 ===================== */
function awlSVG(tip){
  return `<svg viewBox="0 0 60 120" width="54" height="108"><rect x="16" y="4" width="28" height="40" rx="9" fill="#a0522d"/><rect x="16" y="14" width="28" height="4" fill="#7c3f1d"/><polygon points="18,44 42,44 ${30 + tip/2},114 ${30 - tip/2},114" fill="#cbd5e1"/></svg>`;
}
function vinylSVG(hold, holdW, popped){
  const hand = x => `<text x="${x}" y="60" font-size="34">🖐</text>`;
  return `<svg viewBox="0 0 360 120" width="100%" style="max-width:420px;display:block;margin:auto">
    <rect x="50" y="30" width="260" height="60" rx="6" fill="${popped ? '#1f2937' : 'rgba(147,197,253,.35)'}" stroke="#93c5fd" stroke-width="2" ${hold ? '' : 'stroke-dasharray="6 5"'}/>
    ${popped ? '<text x="150" y="70" font-size="30">💎✨</text>' : '<text x="135" y="68" font-size="15" fill="#cbd5e1">마법 비닐</text>'}
    ${hold ? hand(8) + hand(316) : ''}${holdW ? '<text x="8" y="112" font-size="26">🛡️</text><text x="316" y="112" font-size="26">🛡️</text>' : ''}
  </svg>`;
}
function plateSVG(k){
  const s = Math.round(34 * Math.sqrt(k));

/* 입자 시뮬레이션 (느린 속도) */
function startSims(scope){
  scope.querySelectorAll('canvas[data-sim]').forEach(cv => { if (!cv.__on) { cv.__on = true; runSim(cv, cv.dataset.sim); } });
}
function runSim(cv, kind){
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  const ps = [];
  const add = n => { while (ps.length < n) { const a = Math.random() * 6.28, sp = 1 + Math.random() * 0.8; ps.push({x:W/2 + (Math.random() - .5) * 40, y:H/2 + (Math.random() - .5) * 30, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp}); } ps.length = n; };
  function frame(){
    if (!cv.isConnected) return;
    ctx.clearRect(0, 0, W, H);
    let bounce;
    if (kind === 'ball') {
      const g = st('garden'), n = BASE.filter(r => (g.pumps || {})[r]).length, cx = W/2, cy = H/2 - 12, R = 86;
      add(5 + 5 * n);
      ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.29); ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = n >= 4 ? '#f8fafc' : '#94a3b8'; ctx.setLineDash(n >= 4 ? [] : [10, 6]); ctx.stroke(); ctx.setLineDash([]);
      cv.__hits = cv.__hits || []; const t = performance.now(); cv.__hits = cv.__hits.filter(x => t - x < 1000);
      ctx.fillStyle = '#ffd166'; ctx.font = 'bold 16px Noto Sans KR'; ctx.textAlign = 'center';
      ctx.fillText(`벽에 부딪히는 횟수: 1초에 ${cv.__hits.length}번`, cx, H - 10); ctx.textAlign = 'left';
      bounce = p => { const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy); if (d > R - 8) { const nx = dx/d, ny = dy/d, dot = p.vx*nx + p.vy*ny; if (dot > 0) { p.vx -= 2*dot*nx; p.vy -= 2*dot*ny; cv.__hits.push(t); p.flash = 10; } p.x = cx + nx*(R - 9); p.y = cy + ny*(R - 9); } };
    } else {
      const vol = st('library').vol || 60, x0 = 34, full = 300, px = x0 + full * vol / 60, y0 = 38, y1 = 112;
      add(14);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3; ctx.strokeRect(x0, y0, full + 6, y1 - y0);
      ctx.fillStyle = '#ef4444'; ctx.fillRect(x0 - 16, y0 + 22, 16, 30);
      ctx.fillStyle = '#cbd5e1'; ctx.font = '13px Noto Sans KR'; ctx.fillText('막음', x0 - 26, y0 + 16);
      for (const v of [20, 30, 60]) { const x = x0 + full * v / 60; ctx.fillStyle = '#9ea6cc'; ctx.fillRect(x, y1, 2, 10); ctx.fillText(v + ' mL', x - 16, y1 + 26); }
      ctx.fillStyle = 'rgba(96,165,250,.12)'; ctx.fillRect(x0, y0, px - x0, y1 - y0);
      ctx.fillStyle = '#a78bfa'; ctx.fillRect(px, y0 + 2, 10, y1 - y0 - 4); ctx.fillRect(px + 10, (y0 + y1)/2 - 4, 360 - px, 8);
      bounce = p => { if (p.x < x0 + 5) { p.x = x0 + 5; p.vx = Math.abs(p.vx); } if (p.x > px - 5) { p.x = px - 5; p.vx = -Math.abs(p.vx); } if (p.y < y0 + 5) { p.y = y0 + 5; p.vy = Math.abs(p.vy); } if (p.y > y1 - 5) { p.y = y1 - 5; p.vy = -Math.abs(p.vy); } };
    }
    for (const p of ps) { p.x += p.vx; p.y += p.vy; bounce(p); ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 6.29); ctx.fillStyle = p.flash > 0 ? '#fbbf24' : '#93c5fd'; if (p.flash > 0) p.flash--; ctx.fill(); }
    requestAnimationFrame(frame);
  }
  frame();
}

function sfxDiff(){

    pend:Object.values((room.notices || {})[me.role] || {}).filter(n => !n.done).length, dmg:st('hall').dmg || 0};

  if (stage() === 4 && (st('hall').dmg || 0) >= BOSS_HP && !hallSolving) {
    if (DB.mode === 'firebase' && now() - room.startedAt < 185000) { if (!ui.hallWait) { ui.hallWait = true; toast('🗿 골렘이 아직 버틴다! 모험 3분이 지나면 쓰러져요'); } }

function mapHTML(){
  const sg = stage();
  const tile = id => {
    const P = PLACES[id]; const here = presentAt(id);
    const s = P.stage ? (solved(id) ? 'solved' : P.stage > sg ? 'locked' : 'target') : '';
    const badge = !P.stage ? '' : solved(id) ? '✅' : P.stage > sg ? '🔒' : '✨';
    const need = !P.stage ? '출발 지점' : P.need === 'all' ? '👥 모두 함께' : '👥 ' + P.need.map(RN).join('+');
    const go = id === myTarget() && myLoc() !== id;
    return `<button class="tile ${s} ${P.outdoor ? 'out' : ''} ${myLoc() === id ? 'here' : ''} ${go ? 'go' : ''}" data-act="move" data-id="${id}">
      <span class="badge">${badge}</span>${go ? '<span class="gotag">👉 여기로!</span>' : ''}<div class="tname">${P.emoji} ${P.name}</div><div class="tneed">${need}</div>
      <div class="avs">${here.map(r => ROLES[r].icon).join('')}</div></button>`;
  };
  return `<div class="roof">🏫 ${SCHOOL} · 장소를 눌러 이동</div>
    <div class="floor"><div class="flabel">4층</div>${tile('hall')}</div>
    <div class="floor"><div class="flabel">3층</div>${tile('science')}</div>
    <div class="floor"><div class="flabel">2층</div>${tile('info')}${tile('library')}</div>
    <div class="floor"><div class="flabel">1층</div>${tile('cafeteria')}</div>
    <div class="floor ground"><div class="flabel">밖</div>${tile('gate')}${tile('garden')}</div>`;
}
function myTarget(){
  const sg = stage(); if (sg === 5) return null;
  const c = Object.keys(PLACES).filter(k => PLACES[k].stage === sg && !solved(k));
  return c.find(k => myDuties(k).length) || c[0] || null;
}
function RO(w){ const c = w.charCodeAt(w.length - 1); if (c < 0xAC00 || c > 0xD7A3) return w + '로'; const j = (c - 0xAC00) % 28; return w + (j && j !== 8 ? '으로' : '로'); }
function hearts(m){ return isStunnedM(m) ? `😵 <span data-until="${m.stunUntil}"></span>` : '❤️'.repeat(m.hp || 3) + '🖤'.repeat(3 - (m.hp || 3)); }
function teamHTML(){
  const N = room.notices || {};

    const m = members()[r]; const pend = Object.values(N[r] || {}).filter(n => !n.done).length;
    return `<div class="mem">${portrait(r)}<div><div class="nm">${NAME(r) ? esc(NAME(r)) + ' <span class="muted" style="font-weight:400;font-size:14px">' + RN(r) + '</span>' : RN(r)}${r === me.role ? '<span class="me-tag">나</span>' : ''}</div>
      <div class="lc">📍 ${PLACES[m.loc || 'gate'].name}${pend ? ' · 📯 설명 읽는 중' : ''}</div></div>

      ${me.role === 'healer' ? `<button class="btn sm green" data-act="heal" data-t="${r}">치유</button>` : ''}</div>`;

  <div class="items" style="margin-top:8px"><span class="pill">💎 ${items().gem || 0}</span><span class="pill">🪙 ${items().gold || 0}</span><span class="pill">🧪 ${items().potion || 0}</span>${room.shieldActive ? '<span class="pill">🛡️ 방패 ON</span>' : ''}</div>`;
}
function abilHTML(){
  const m = members()[me.role]; let b = '';
  if (me.role === 'healer') b += `<button class="btn sm green" data-act="hint" ${room.hintUsed ? 'disabled' : ''}>💡 모둠 힌트${room.hintUsed ? ' (씀)' : ''}</button>`;

  const inner = stationInner(), loc = myLoc(), t = myTarget();
  if (stage() === 5) return inner;
  let g;
  if (t && loc !== t) g = `<div class="guide go">👉 지도에서 반짝이는 <b>${PLACES[t].emoji} ${RO(PLACES[t].name)}</b> 가자!</div>`;

  return h + hintHTML(loc);

function tick(noRender){
  document.querySelectorAll('[data-until]').forEach(s => s.textContent = Math.max(0, Math.ceil((+s.dataset.until - now()) / 1000)) + '초');
  if (!me || !room || !room.startedAt) return;
  const tEl = $('#timer');
  if (tEl) { const t = (room.finishedAt || now()) - room.startedAt; tEl.textContent = fmt(t); tEl.style.color = t > TARGET_MIN * 60000 && !room.finishedAt ? '#f87171' : ''; }
  if (noRender) return;
  // 야외에서 혼자: 20초마다 말벌
  if (myLoc() === 'garden' && !solved('garden') && !presenceOK('garden') && !isStunned(me.role)) {
    if (!waspStart) waspStart = now();
    else if (now() - waspStart > 20000) { waspStart = now(); damage(me.role, '말벌 침 (야외 혼자)'); }
  } else waspStart = 0;
  render();
}

  setScreen('teacher', `<div class="wrap"><div class="card"><div class="row" style="justify-content:space-between">
    <h2 class="jua">👩‍🏫 선생님 화면</h2><div class="row"><select id="tCls">${Array.from({length:CLASS_COUNT}, (_, i) => `<option value="${i+1}" ${i+1 === teacher.cls ? 'selected' : ''}>${i+1}반</option>`).join('')}</select>
    <span id="tLock"></span><button class="btn red sm" data-act="tResetClass">이 반 기록 모두 지우기</button><button class="btn sm" data-act="tBack">로그아웃</button></div></div>
    ${MODE_BANNER()}<div id="tBoard" style="margin-top:10px"></div><div id="tTeachers"></div></div>${FOOT}</div>`);
  watchTeacher();
  if (isOwner) { if (unsubT) unsubT(); unsubT = DB.watch('teachers', v => renderTeachers(v || {})); }
}
let unsubLock = null, classLocked = false, unsubT = null;
function renderTeachers(T){
  const el = $('#tTeachers'); if (!el) return;
  const list = Object.keys(T).filter(k => T[k]).map(k => k.replace(/,/g, '.'));
  paint(el, `<div class="box"><b>👥 함께 쓰는 선생님</b> <span class="muted" style="font-size:13px">(여기 추가된 Google 계정은 선생님 화면에 들어올 수 있어요 · 관리는 ${esc(TEACHER_EMAIL)}만)</span>
    <div class="row" style="margin-top:8px;gap:6px">${list.length ? list.map(e => `<span class="pill">${esc(e)} <button class="btn sm" style="padding:0 6px" data-act="tDelT" data-e="${esc(e)}">✕</button></span>`).join('') : '<span class="muted">아직 없어요</span>'}</div>
    <div class="row" style="margin-top:8px"><input id="tEmail" type="email" placeholder="선생님 Gmail 주소" autocomplete="off" style="font:inherit;padding:7px 10px;border-radius:10px;border:2px solid #8b5cf6;background:#0b0e1c;color:var(--text);min-width:260px"><button class="btn primary sm" data-act="tAddT">추가</button></div></div>`);
}
function watchTeacher(){
  if (unsubLock) unsubLock();
  unsubLock = DB.watch(`locks/c${teacher.cls}`, v => { classLocked = !!v; const el = $('#tLock'); if (el) el.innerHTML = `<button class="btn sm ${classLocked ? 'green' : 'gold'}" data-act="tLockToggle">${classLocked ? '🔓 입장 다시 열기' : '🔒 입장 마감'}</button>`; });
  if (unsubClass) unsubClass();
  unsubClass = DB.watch(`escape/c${teacher.cls}`, v => { classData = v || {}; renderTeacher(); });
}
function suspicious(r){
  const at = Object.keys(PLACES).filter(k => PLACES[k].stage && r.st && r.st[k] && r.st[k].at).map(k => r.st[k].at).sort((a, b) => a - b);
  const why = [];
  for (let i = 1; i < at.length; i++) if (at[i] - at[i - 1] < 20000) { why.push('장소를 20초 안에 연달아 해결'); break; }
  if (r.finishedAt && r.startedAt && r.finishedAt - r.startedAt < 360000) why.push('6분 안에 완료');
  return why;
}
function renderTeacher(){
  const el = $('#tBoard'); if (!el) return;
  const G = classData || {};
  const rows = Array.from({length:GROUP_COUNT}, (_, i) => {
    const g = i + 1, r = G['g' + g];
    if (!r || !(r.members || r.seats)) return `<tr><td>${g}번</td><td colspan="6" class="muted">입장 전</td><td></td></tr>`;
    const sg = stageOf(r), M = r.members || {}, N = r.notices || {}, S = r.seats || {};
    const pend = Object.values(N).reduce((a, o) => a + Object.values(o).filter(n => !n.done).length, 0);
    const t = r.startedAt ? fmt((r.finishedAt || now()) - r.startedAt) : '대기';
    const sus = suspicious(r);
    const mem = ROLE_ORDER.filter(x => M[x] || S[x]).map(x => `<span style="white-space:nowrap">${ROLES[x].icon}${esc((M[x] && M[x].name) || '?')}${M[x] && isStunnedM(M[x]) ? '😵' : ''}<button class="btn sm" style="padding:0 5px;margin-left:2px" title="자리 비우기" data-act="tFree" data-g="${g}" data-r="${x}">✕</button></span>`).join(' ');
    return `<tr><td>${g}번</td><td style="text-align:left">${mem}</td>
      <td>${sg === 5 ? '🏆 완료' : STAGE_NAMES[sg]}</td><td>${t}</td><td>💎${(r.items || {}).gem || 0} 🪙${(r.items || {}).gold || 0}</td>
      <td>${pend ? '📯 ' + pend : '✅'}</td><td>${sus.length ? `<span style="color:#fbbf24" title="${esc(sus.join(', '))}">⚠️ ${esc(sus.join(', '))}</span>` : ''}</td>
      <td><button class="btn sm" data-act="tResetGroup" data-g="${g}">초기화</button></td></tr>`;
  }).join('');
  const done = Object.entries(G).filter(([g, r]) => r && r.finishedAt && r.startedAt)
    .map(([g, r]) => ({g:g.slice(1), t:r.finishedAt - r.startedAt, it:r.items || {}, sus:suspicious(r).length, names:ROLE_ORDER.filter(x => r.members && r.members[x]).map(x => r.members[x].name).filter(Boolean)}))
    .sort((a, b) => a.t - b.t || (b.it.gem || 0) - (a.it.gem || 0));
  const medal = ['🥇', '🥈', '🥉'];
  paint(el, `<div class="box" style="font-size:20px"><b class="jua" style="font-size:26px">🏆 ${teacher.cls}반 순위</b> <span class="muted" style="font-size:14px">(TV에 띄워 함께 보세요)</span>
      ${done.length ? `<table class="rank" style="font-size:20px"><tr><th>순위</th><th>파티</th><th>모험가</th><th>시간</th><th>💎</th><th>🪙</th></tr>
      ${done.map((x, i) => `<tr><td>${medal[i] || i + 1}</td><td>${x.g}번 파티${x.sus ? ' ⚠️' : ''}</td><td>${esc(x.names.join(', '))}</td><td>${fmt(x.t)}</td><td>${x.it.gem || 0}</td><td>${x.it.gold || 0}</td></tr>`).join('')}</table>`
      : '<p class="muted">아직 골렘을 쓰러뜨린 파티가 없어요</p>'}</div>
    <div style="overflow-x:auto"><table class="rank"><tr><th>파티</th><th>모험가 (✕ 자리 비우기)</th><th>단계</th><th>시간</th><th>보물</th><th>이해 대기</th><th>확인 필요</th><th></th></tr>${rows}</table></div>
    <p class="muted" style="font-size:13px">🔒 파티가 시작되고 5분이 지나면 빈자리가 <b>자동으로 닫혀요</b>. 더 일찍 막고 싶으면 <b>입장 마감</b>을 눌러 주세요. · ⚠️ 표시는 너무 빠르게 해결된 기록이에요. 해당 파티에게 어떻게 풀었는지 물어봐 주세요. · 수업이 끝나면 <b>이 반 기록 모두 지우기</b>를 눌러 학생 이름을 지워 주세요.</p>`);
}
setInterval(() => { if (screen === 'teacher') renderTeacher(); }, 3000);

/* --- 시작 --- */
(function init(){
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem('pq_me2')); } catch(e){}
  if (saved && saved.role) { entry.resume = saved; entry.cls = saved.cls; entry.grp = saved.grp; }
  showEntry();
})();
</script>
