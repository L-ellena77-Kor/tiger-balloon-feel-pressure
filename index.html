<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>호랑이 풍선 속 나</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 제목 → 큰 3D 무대(오버레이: 상태 칩, 내 얼굴 카드, 시점 안내, 쿵 효과) → 조작 두 줄. 어두운 단일 테마 */
:root{
  --bg:#0b1220;
  --panel:#142032;
  --line:#2b3d55;
  --fg:#eaf0f7;
  --muted:#93a6bd;
  --particle:#ffbf5a;
  --me:#c39bff;
  --hit:#ff7a6b;
  --accent:#6fd3ff;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--body);font-size:18px;line-height:1.5;padding-inline:16px;padding-block:14px 24px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,48px);line-height:1.1;margin:0}
.lede{margin:0;color:var(--muted);font-size:clamp(16px,1.7vw,20px)}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:70vh;min-height:320px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(100% 90% at 50% 40%,#16263f 0%,var(--bg) 75%);touch-action:none;cursor:grab}
.stage:fullscreen{max-height:none;border-radius:0}
.stage canvas.gl{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;max-width:calc(100% - 24px)}
.chip.me b{color:var(--me)}
.chip{background:rgba(11,18,32,.6);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:clamp(12px,1.1vw,15px);white-space:nowrap}
@media (max-width:600px){.hud{left:8px;top:8px;gap:4px}.chip{font-size:11px;padding:1px 8px}}
.chip b{font-family:var(--mono);color:var(--particle);font-variant-numeric:tabular-nums}
.mecard{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(11,18,32,.82);border:1px solid var(--line);border-radius:14px;padding:8px 10px;pointer-events:none}
.mecard canvas{width:clamp(56px,7vw,84px);height:clamp(56px,7vw,84px);border-radius:50%;border:4px solid var(--me);background:#8e5cf0}
.mecard .lbl{font-size:14px;color:var(--muted);white-space:nowrap}
.mecard b{font-family:var(--mono);font-size:clamp(20px,2.4vw,28px);color:var(--me);line-height:1}
.mecard.bump canvas{animation:bump .35s ease-out}
@keyframes bump{0%{transform:translate(0,0) scale(1.15)}20%{transform:translate(-5px,3px) rotate(-8deg)}45%{transform:translate(5px,-3px) rotate(7deg)}70%{transform:translate(-3px,2px) rotate(-3deg)}100%{transform:none}}
.guide{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);background:rgba(11,18,32,.7);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-weight:700;font-size:clamp(13px,1.4vw,19px);transition:opacity .8s;text-align:center;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 14px rgba(255,122,107,.85);opacity:0}
.kung{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(32px,5vw,72px);color:#ffd36b;text-shadow:0 0 24px rgba(255,120,80,.8),0 4px 0 #7a2a14;pointer-events:none;opacity:0;white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{font:600 17px var(--body);color:var(--fg);background:#1d2d44;border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#25395a}
.btn.primary{background:var(--me);color:#160a2a;border-color:var(--me)}
.btn[aria-pressed="true"]{background:#3a2a5c;border-color:var(--me);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:700 17px var(--body);color:var(--muted);background:#17263b;border:0;padding:10px 16px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#08121e}
.slider{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.slider label{font-weight:600;white-space:nowrap}
.slider input{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.slider output{font-family:var(--mono);color:var(--particle);min-width:5.5ch;text-align:right;white-space:nowrap}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.cam{position:fixed;inset:0;z-index:50;background:rgba(5,9,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.cam .view{position:relative;width:min(90vw,70vh*1.33,720px);aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:2px solid var(--me);background:#000}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam .ring{position:absolute;left:50%;top:48%;width:46%;aspect-ratio:0.85;transform:translate(-50%,-50%);border:4px dashed rgba(195,155,255,.9);border-radius:50%;pointer-events:none}
.cam .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(60px,14vw,140px);color:#fff;text-shadow:0 0 20px rgba(0,0,0,.7);pointer-events:none}
.cam .tip{font-size:clamp(15px,1.8vw,20px);color:var(--fg);text-align:center;margin:0}
.cam .msg{color:var(--hit);font-weight:700;text-align:center;margin:0;min-height:1.5em}
.cam .acts{display:flex;gap:10px}
.note{font-size:14px;color:var(--muted);margin:0}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>호랑이 풍선 속으로!</h1>
    <p class="lede">내 얼굴이 기체 입자가 되어 풍선 벽에 부딪쳐요. 그 충돌이 모여 압력이 돼요.</p>
  </header>

  <div class="stage" id="stage">
    <div class="hud">
      <span class="chip">풍선 속 입자 <b id="hN">61</b>개</span>
      <span class="chip">1초 동안 벽 충돌 <b id="hH">–</b>회</span>
      <span class="chip">풍선 부피 <b id="hV">×1.0</b></span>
      <span class="chip me">내가 벽을 민 횟수 <b id="hMe">0</b>회</span>
    </div>
    <div class="guide" id="guide" hidden>나는 기체 입자! 부딪칠 때마다 풍선을 밖으로 밀어요</div>
    <div class="flash" id="flash"></div>
    <div class="kung" id="kung">쿵!</div>
  </div>

  <div class="cam" id="cam" hidden role="dialog" aria-label="셀카 찍기">
    <p class="tip">점선 동그라미 안에 얼굴을 맞춰 주세요</p>
    <div class="view"><video id="camVideo" playsinline muted></video><div class="ring"></div><div class="count" id="count"></div></div>
    <p class="msg" id="camMsg"></p>
    <div class="acts"><button class="btn primary" id="shoot" type="button" disabled>📸 찍기 (3초 뒤)</button><button class="btn" id="camClose" type="button">취소</button></div>
  </div>

  <div class="rows">
    <div class="bar">
      <button class="btn primary" id="camBtn" type="button">📷 셀카 찍기</button>
      <label class="btn" for="photo">🖼 사진 고르기<input type="file" id="photo" accept="image/*"></label>
      <button class="btn" id="defFace" type="button">기본 얼굴</button>
      <div class="seg" role="group" aria-label="시점">
        <button type="button" data-view="out" aria-pressed="true">바깥에서 보기</button>
        <button type="button" data-view="in" aria-pressed="false">내가 입자 되기</button>
      </div>
      <button class="btn" id="see" type="button" aria-pressed="true">풍선 속 보기</button>
      <button class="btn" id="force" type="button" aria-pressed="true">힘 선 켜짐</button>
      <button class="btn" id="sound" type="button" aria-pressed="false">🔈 소리 끔</button>
      <button class="btn" id="play" type="button">⏸ 멈춤</button>
      <button class="btn" id="full" type="button">⛶ 전체 화면</button>
    </div>
    <div class="bar">
      <div class="slider"><label for="n">입자 수</label><input type="range" id="n" min="10" max="120" step="10" value="60"><output id="nv">60개</output></div>
      <div class="slider"><label for="t">온도</label><input type="range" id="t" min="0" max="4" step="1" value="2"><output id="tv">보통</output></div>
    </div>
    <p class="note">셀카는 이 기기 화면 안에서만 쓰이고 어디에도 저장되거나 보내지지 않아요. 페이지를 닫거나 새로 고치면 사라져요. 바깥에서 보기에서는 풍선을 끌어서 돌릴 수 있어요. ⓒ 오효선</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const R = 10, PR = 0.3, MR = 1.3, BASEV = 5.2;
  let Rc = R;   // 지금 풍선 크기 (입자 수·온도에 따라 바뀜)
  const TEMPS = [0.4, 0.7, 1, 1.5, 2.2], TNAMES = ['매우 낮음', '낮음', '보통', '높음', '매우 높음'];
  const rnd = (a, b) => a + Math.random() * (b - a);

  // 풍선 모양: 위는 둥글고 아래로 갈수록 좁고 길게
  const shapeS = uy => 1 - 0.14 * Math.pow(Math.max(0, -uy), 2);
  const shapeE = uy => uy < 0 ? 1.2 : 1.0;
  const boundR = n => Rc * Math.hypot(n.x * shapeS(n.y), n.y * shapeE(n.y), n.z * shapeS(n.y));

  // ---------- 렌더러 ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.domElement.className = 'gl';
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 200);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(12, 16, 20); scene.add(sun);
  const inner = new THREE.PointLight(0xffe2c4, 0, 40); scene.add(inner);
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);

  // ---------- 호랑이 풍선 무늬 (구면 펼친 그림, 얼굴은 앞쪽 u=0.25) ----------
  function tigerTexture() {
    const W = 2048, H = 1024, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#ffa23a'); bg.addColorStop(0.6, '#f28420'); bg.addColorStop(1, '#d9661a');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    const cx = W * 0.25, cy = H * 0.5;
    // 뒤통수 줄무늬: 머리 꼭대기·아래쪽은 비우고, 뒤쪽 가운데를 향해 모이는 깔끔한 V자 무늬만
    g.fillStyle = '#2a1a12';
    const bx = W * 0.75;
    [[0.31, 0.15, 20], [0.43, 0.20, 26], [0.55, 0.21, 27], [0.67, 0.15, 20]].forEach(([v, half, th], j) => {
      const yc = H * v, gap = 26;
      for (const s of [-1, 1]) {
        const x0 = bx + s * gap, x1 = bx + s * W * half, n = 40;
        g.beginPath();
        for (let i = 0; i <= n; i++) {
          const f = i / n, x = x0 + (x1 - x0) * f, taper = Math.sin(Math.PI * Math.min(1, f * 1.15)) ** 0.7;
          g.lineTo(x, yc - 22 * (1 - f) + 10 * f * f - th * taper);
        }
        for (let i = n; i >= 0; i--) {
          const f = i / n, x = x0 + (x1 - x0) * f, taper = Math.sin(Math.PI * Math.min(1, f * 1.15)) ** 0.7;
          g.lineTo(x, yc - 22 * (1 - f) + 10 * f * f + th * taper);
        }
        g.closePath(); g.fill();
      }
    });
    // 아래쪽은 크림색으로 부드럽게
    const belly = g.createLinearGradient(0, H * 0.74, 0, H);
    belly.addColorStop(0, 'rgba(255,236,210,0)'); belly.addColorStop(1, 'rgba(255,236,210,0.85)');
    g.fillStyle = belly; g.fillRect(0, H * 0.74, W, H * 0.26);
    g.fillStyle = '#2a1a12';
    // 볼 옆 줄무늬
    for (const s of [-1, 1]) for (let j = 0; j < 3; j++) {
      const y = cy - 40 + j * 55, xs = cx + s * 290, xe = cx + s * (190 - j * 10);
      g.beginPath(); g.moveTo(xs, y - 16); g.quadraticCurveTo((xs + xe) / 2, y - 6, xe, y); g.quadraticCurveTo((xs + xe) / 2, y + 8, xs, y + 16); g.closePath(); g.fill();
    }
    // 흰 털: 눈 위, 볼, 턱
    g.fillStyle = '#fff6ea';
    for (const s of [-1, 1]) {
      g.beginPath(); g.ellipse(cx + s * 88, cy - 70, 62, 30, s * 0.25, 0, 7); g.fill();
      g.beginPath(); g.ellipse(cx + s * 72, cy + 85, 100, 72, 0, 0, 7); g.fill();
    }
    g.beginPath(); g.ellipse(cx, cy + 150, 78, 48, 0, 0, 7); g.fill();
    // 이마의 王 무늬
    g.strokeStyle = '#2a1a12'; g.lineCap = 'round'; g.lineWidth = 18;
    [[-62, 62, -205], [-42, 42, -168], [-62, 62, -131]].forEach(([a, b, y]) => { g.beginPath(); g.moveTo(cx + a, cy + y); g.lineTo(cx + b, cy + y); g.stroke(); });
    g.beginPath(); g.moveTo(cx, cy - 205); g.lineTo(cx, cy - 131); g.stroke();
    // 눈
    for (const s of [-1, 1]) {
      g.fillStyle = '#1f150f'; g.beginPath(); g.ellipse(cx + s * 82, cy - 18, 30, 36, 0, 0, 7); g.fill();
      g.fillStyle = '#ffffff'; g.beginPath(); g.arc(cx + s * 82 - 9, cy - 32, 11, 0, 7); g.fill();
      g.beginPath(); g.arc(cx + s * 82 + 10, cy - 6, 5, 0, 7); g.fill();
    }
    // 코와 입
    g.fillStyle = '#e8766a'; g.strokeStyle = '#4a2018'; g.lineWidth = 6;
    g.beginPath(); g.moveTo(cx - 34, cy + 38); g.quadraticCurveTo(cx, cy + 26, cx + 34, cy + 38); g.quadraticCurveTo(cx + 18, cy + 74, cx, cy + 78); g.quadraticCurveTo(cx - 18, cy + 74, cx - 34, cy + 38); g.fill(); g.stroke();
    g.lineWidth = 8; g.beginPath(); g.moveTo(cx, cy + 78); g.lineTo(cx, cy + 102);
    g.moveTo(cx - 52, cy + 100); g.quadraticCurveTo(cx - 26, cy + 128, cx, cy + 102); g.quadraticCurveTo(cx + 26, cy + 128, cx + 52, cy + 100); g.stroke();
    g.fillStyle = '#4a2018';
    for (const s of [-1, 1]) for (let j = 0; j < 3; j++) { g.beginPath(); g.arc(cx + s * (70 + j * 22), cy + 72 + (j % 2) * 16, 6, 0, 7); g.fill(); }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
  }

  // ---------- 호랑이 풍선 (출렁이는 표면) ----------
  const geo = new THREE.SphereGeometry(R, 96, 64);
  const unit = Float32Array.from(geo.attributes.position.array, v => v / R);
  const shapePos = new Float32Array(unit.length);
  for (let i = 0; i < unit.length; i += 3) { const uy = unit[i + 1], s = shapeS(uy); shapePos[i] = unit[i] * s * R; shapePos[i + 1] = uy * shapeE(uy) * R; shapePos[i + 2] = unit[i + 2] * s * R; }
  const mat = new THREE.MeshStandardMaterial({ map: tigerTexture(), roughness: 0.35, metalness: 0.0, side: THREE.DoubleSide, transparent: true, opacity: 0.5, depthWrite: false });
  const balloon = new THREE.Group(); scene.add(balloon);
  const ballMesh = new THREE.Mesh(geo, mat); balloon.add(ballMesh);
  // 귀
  const ears = [];
  const earMat = new THREE.MeshStandardMaterial({ color: 0xf28420, roughness: 0.4, transparent: true, opacity: 0.5 });
  const earIn = new THREE.MeshStandardMaterial({ color: 0xffd1c4, roughness: 0.5 });
  for (const s of [-1, 1]) {
    const d = new THREE.Vector3(s * 0.45, 0.84, 0.3).normalize(), p = d.clone().multiplyScalar(boundR(d) * 0.96);
    const ear = new THREE.Mesh(new THREE.SphereGeometry(2.1, 20, 14), earMat);
    ear.scale.set(1, 1.05, 0.45); ear.position.copy(p); ear.lookAt(p.clone().add(new THREE.Vector3(0, 0.6, 1.4)));
    const ein = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 12), earIn); ein.position.set(0, -0.15, 1.2); ein.scale.set(1, 1.1, 0.4);
    ear.add(ein); balloon.add(ear); ears.push({ ear, d });
  }
  // 매듭과 끈
  let bottomY = -R * 1.2;
  const knot = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.2, 16), new THREE.MeshStandardMaterial({ color: 0xd9661a, roughness: 0.4 }));
  knot.position.set(0, bottomY - 0.4, 0); balloon.add(knot);
  const STR = 30, strPos = new Float32Array(STR * 3), strGeo = new THREE.BufferGeometry();
  strGeo.setAttribute('position', new THREE.BufferAttribute(strPos, 3));
  balloon.add(new THREE.Line(strGeo, new THREE.LineBasicMaterial({ color: 0xc9d3e0 })));

  // ---------- 나 (얼굴 입자) ----------
  const meCanvas = document.createElement('canvas'); meCanvas.width = 1024; meCanvas.height = 512;
  const meTex = new THREE.CanvasTexture(meCanvas); meTex.encoding = THREE.sRGBEncoding;
  const faceCanvas = document.createElement('canvas');
  function drawDefaultFace(g, w, h) {
    g.fillStyle = '#f4c9a6'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#2b1d16';
    g.beginPath(); g.ellipse(w * 0.33, h * 0.42, w * 0.06, h * 0.07, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(w * 0.67, h * 0.42, w * 0.06, h * 0.07, 0, 0, 7); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(w * 0.35, h * 0.40, w * 0.018, 0, 7); g.fill();
    g.beginPath(); g.arc(w * 0.69, h * 0.40, w * 0.018, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,120,120,.45)';
    g.beginPath(); g.ellipse(w * 0.22, h * 0.6, w * 0.08, h * 0.04, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(w * 0.78, h * 0.6, w * 0.08, h * 0.04, 0, 0, 7); g.fill();
    g.strokeStyle = '#7a2e2a'; g.lineWidth = w * 0.03; g.lineCap = 'round';
    g.beginPath(); g.arc(w * 0.5, h * 0.58, w * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  }
  function buildMe(img) {
    const fw = 420, fh = 360; faceCanvas.width = fw; faceCanvas.height = fh;
    const t2 = faceCanvas.getContext('2d');
    if (img) {
      const want = fw / fh; let sw = img.width, sh = img.width / want;
      if (sh > img.height) { sh = img.height; sw = sh * want; }
      const sx = (img.width - sw) / 2, sy = Math.max(0, Math.min(img.height - sh, img.height * 0.42 - sh / 2));
      t2.drawImage(img, sx, sy, sw, sh, 0, 0, fw, fh);
    } else drawDefaultFace(t2, fw, fh);
    // 공 표면용: 가장자리를 보라색으로 부드럽게
    t2.globalCompositeOperation = 'destination-in';
    t2.save(); t2.scale(1, fh / fw);
    const gr = t2.createRadialGradient(fw / 2, fw / 2, fw * 0.36, fw / 2, fw / 2, fw * 0.5);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    t2.fillStyle = gr; t2.fillRect(0, 0, fw, fw); t2.restore(); t2.globalCompositeOperation = 'source-over';
    const g = meCanvas.getContext('2d');
    g.fillStyle = '#8e5cf0'; g.fillRect(0, 0, 1024, 512);
    g.drawImage(faceCanvas, 256 - fw / 2, 256 - fh / 2);
    meTex.needsUpdate = true;
  }
  buildMe(null);
  const meMesh = new THREE.Mesh(new THREE.SphereGeometry(MR, 40, 28), new THREE.MeshStandardMaterial({ map: meTex, roughness: 0.45, emissive: 0x2a1450 }));
  scene.add(meMesh);
  const meGlow = new THREE.Mesh(new THREE.SphereGeometry(MR * 1.08, 32, 20), new THREE.MeshBasicMaterial({ color: 0xc39bff, transparent: true, opacity: 0.25, side: THREE.BackSide, depthWrite: false }));
  meMesh.add(meGlow);
  const TRAIL = 80, trailPos = new Float32Array(TRAIL * 3), trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xc39bff, transparent: true, opacity: 0.6 }));
  scene.add(trail); let trailN = 0;

  // ---------- 다른 입자 ----------
  const MAXN = 120;
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(PR, 14, 10), new THREE.MeshStandardMaterial({ color: 0xffbf5a, emissive: 0x7a4a00, roughness: 0.4 }), MAXN);
  scene.add(inst);
  let N = 60, T = 1, parts = [];
  function spawn(isMe) {
    const d = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize();
    const p = d.clone().multiplyScalar(Math.cbrt(Math.random()) * Rc * 0.5);
    const v = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(BASEV * Math.sqrt(T) * (isMe ? 1 : rnd(0.6, 1.4)));
    return { p, v };
  }
  function setN(n) { while (parts.length < n + 1) parts.push(spawn(parts.length === 0)); parts.length = n + 1; inst.count = n; }
  function setT(nt) { const k = Math.sqrt(nt / T); parts.forEach(q => q.v.multiplyScalar(k)); T = nt; }
  setN(N);

  // ---------- 충돌: 표면 출렁임, 힘 선, 흔들림 ----------
  let bumps = [], showForce = true, buckets = new Array(10).fill(0), bI = 0, bT = 0, hitShown = 0, myHits = 0, elapsed = 0;
  const MAXL = 160, lPos = new Float32Array(MAXL * 6), lCol = new Float32Array(MAXL * 6), lines = [];
  const lGeo = new THREE.BufferGeometry();
  lGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3)); lGeo.setAttribute('color', new THREE.BufferAttribute(lCol, 3));
  const lineMesh = new THREE.LineSegments(lGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  balloon.add(lineMesh);
  let shake = 0, flash = 0, kungT = 9, guideT = 0;

  function onHit(i, n, vn) {
    buckets[bI]++;
    const s = vn / BASEV;
    bumps.push({ x: n.x, y: n.y, z: n.z, a: (i ? 0.55 : 0.9) * s, t: 0 }); if (bumps.length > 70) bumps.shift();
    lines.push({ n: n.clone(), s: i ? s : s * 1.5, t: 0 }); if (lines.length > MAXL) lines.shift();
    if (i === 0) {
      myHits++; shake = Math.min(1.2, 0.5 + 0.5 * s); flash = 1; kungT = 0;
      if (view === 'in') { try { navigator.vibrate && navigator.vibrate(40 + Math.round(40 * s)); } catch (e) {} }
      thud(s);
    } else tick(s);
  }

  function step(dt) {
    for (let i = 0; i < parts.length; i++) {
      const q = parts[i]; q.p.addScaledVector(q.v, dt);
      const L = q.p.length() || 1e-6, n = q.p.clone().divideScalar(L), lim = boundR(n) - (i ? PR : MR);
      if (L > lim) {
        const vn = q.v.dot(n);
        if (vn > 0) { q.v.addScaledVector(n, -2 * vn); onHit(i, n, vn); }
        q.p.copy(n).multiplyScalar(lim);
      }
    }
    bT += dt; while (bT >= 0.1) { bT -= 0.1; bI = (bI + 1) % 10; buckets[bI] = 0; }
  }

  function deform(dt) {
    bumps.forEach(b => b.t += dt); bumps = bumps.filter(b => b.t < 0.9);
    const pos = geo.attributes.position.array, W = 0.05, ks = Rc / R;
    const env = bumps.map(b => b.a * Math.exp(-b.t * 5) * Math.cos(b.t * 30));   // 밀렸다가 떨리며 돌아오는 진동
    for (let i = 0; i < pos.length; i += 3) {
      const ux = unit[i], uy = unit[i + 1], uz = unit[i + 2]; let d = 0;
      for (let k = 0; k < bumps.length; k++) {
        const b = bumps[k], c = ux * b.x + uy * b.y + uz * b.z;
        if (c > 0.8) d += env[k] * Math.exp(-2 * (1 - c) / W);
      }
      pos[i] = shapePos[i] * ks + ux * d; pos[i + 1] = shapePos[i + 1] * ks + uy * d; pos[i + 2] = shapePos[i + 2] * ks + uz * d;
    }
    geo.attributes.position.needsUpdate = true; geo.computeVertexNormals();
  }

  function updateLines(dt) {
    lines.forEach(l => l.t += dt);
    while (lines.length && lines[0].t > 0.45) lines.shift();
    let k = 0;
    if (showForce) for (const l of lines) {
      const a = 1 - l.t / 0.45, len = 0.6 + l.s * 1.8, r0 = boundR(l.n) + 0.25;
      lPos.set([l.n.x * r0, l.n.y * r0, l.n.z * r0, l.n.x * (r0 + len), l.n.y * (r0 + len), l.n.z * (r0 + len)], k * 6);
      lCol.set([a, 0.48 * a, 0.42 * a, a, 0.48 * a, 0.42 * a], k * 6); k++;
    }
    lGeo.setDrawRange(0, k * 2);
    lGeo.attributes.position.needsUpdate = true; lGeo.attributes.color.needsUpdate = true;
  }

  // ---------- 소리 (버튼으로 켬) ----------
  let actx = null, soundOn = false, lastTick = 0;
  function thud(s) {
    if (!soundOn || !actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5 * Math.min(1, 0.5 + s * 0.5), t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.32);
  }
  function tick(s) {
    if (!soundOn || !actx) return;
    const t = actx.currentTime; if (t - lastTick < 0.05) return; lastTick = t;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(rnd(700, 1100), t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.04 * Math.min(1.5, s), t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.06);
  }

  // ---------- 시점 ----------
  let view = 'out', seeThrough = true, theta = 0.35, phi = 0.12, dist = 38, dragging = false, lastX = 0, lastY = 0, idle = 0;
  const look = new THREE.Vector3(0, 0, -1);
  function applyMaterial() {
    const op = view === 'out' && seeThrough;
    [mat, earMat].forEach(m => { m.transparent = op; m.opacity = op ? 0.5 : 1; m.depthWrite = !op; m.needsUpdate = true; });
    inner.intensity = view === 'in' ? 1.1 : 0;
    meMesh.visible = trail.visible = view === 'out';
    camera.fov = view === 'in' ? 82 : 42; camera.updateProjectionMatrix();
    $('guide').hidden = view !== 'in'; guideT = 0; $('guide').style.opacity = 1;
    $('see').disabled = view === 'in';
    stage.style.cursor = view === 'in' ? 'default' : 'grab';
    if (view === 'in') look.copy(parts[0].v).normalize();
  }
  stage.addEventListener('pointerdown', e => { if (view !== 'out') return; dragging = true; lastX = e.clientX; lastY = e.clientY; stage.setPointerCapture(e.pointerId); stage.style.cursor = 'grabbing'; });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    theta -= (e.clientX - lastX) * 0.008; phi = Math.max(-1.2, Math.min(1.2, phi + (e.clientY - lastY) * 0.008));
    lastX = e.clientX; lastY = e.clientY; idle = 0;
  });
  const endDrag = () => { dragging = false; if (view === 'out') stage.style.cursor = 'grab'; };
  stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('wheel', e => { if (view !== 'out') return; e.preventDefault(); dist = Math.max(20, Math.min(64, dist + e.deltaY * 0.02)); }, { passive: false });

  // ---------- 매 프레임 ----------
  const m4 = new THREE.Matrix4(), tmpV = new THREE.Vector3();
  let running = !matchMedia('(prefers-reduced-motion: reduce)').matches, last = performance.now(), clock = 0;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now; clock += dt;
    if (running) {
      elapsed += dt;
      const Rt = Math.max(5, Math.min(16, R * Math.cbrt((N + 1) * T / 61)));
      Rc += (Rt - Rc) * Math.min(1, dt * 0.8);
      bottomY = -Rc * 1.2; knot.position.y = bottomY - 0.4;
      for (const e of ears) { const p = e.d.clone().multiplyScalar(boundR(e.d) * 0.96); e.ear.position.copy(p); e.ear.lookAt(p.add(new THREE.Vector3(0, 0.6, 1.4))); }
      step(dt / 2); step(dt / 2);
      deform(dt); updateLines(dt);
      const me = parts[0].p;
      trailPos.copyWithin(3, 0, (TRAIL - 1) * 3); trailPos[0] = me.x; trailPos[1] = me.y; trailPos[2] = me.z;
      trailN = Math.min(TRAIL, trailN + 1); trailGeo.setDrawRange(0, trailN); trailGeo.attributes.position.needsUpdate = true;
    }
    for (let i = 1; i < parts.length; i++) { m4.makeTranslation(parts[i].p.x, parts[i].p.y, parts[i].p.z); inst.setMatrixAt(i - 1, m4); }
    inst.instanceMatrix.needsUpdate = true;
    for (let i = 0; i < STR; i++) { const y = bottomY - 1 - i * 0.35; strPos.set([Math.sin(i * 0.35 + clock * 1.8) * 0.12 * i * 0.3, y, Math.cos(i * 0.3 + clock * 1.3) * 0.05 * i], i * 3); }
    strGeo.attributes.position.needsUpdate = true;

    shake *= Math.exp(-dt * 5); flash *= Math.exp(-dt * 6); kungT += dt;
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    if (view === 'out') {
      if (!dragging) { idle += dt; if (idle > 2) theta += dt * 0.12; }
      const dd = dist * Math.max(0.8, Rc / R);
      camera.position.set(dd * Math.sin(theta) * Math.cos(phi), -1 + dd * Math.sin(phi), dd * Math.cos(theta) * Math.cos(phi));
      camera.lookAt(0, -1, 0);
      balloon.position.set(sx * 0.15, Math.sin(clock * 0.9) * 0.3 + sy * 0.15, 0);
      balloon.rotation.z = Math.sin(clock * 0.6) * 0.04;
    } else {
      balloon.position.set(0, 0, 0); balloon.rotation.z = 0;
      tmpV.copy(parts[0].v).normalize(); look.lerp(tmpV, Math.min(1, dt * 2.2)).normalize();
      camera.position.copy(parts[0].p).addScaledVector(look, -0.4);
      camera.position.x += sx * 0.5; camera.position.y += sy * 0.5;
      camera.lookAt(tmpV.copy(camera.position).add(look));
      camera.rotateZ((Math.random() - 0.5) * shake * 0.15);
    }
    // 나는 풍선과 같은 틀 안에서 움직이므로 풍선 위치를 더해 줌
    meMesh.position.copy(parts[0].p).add(balloon.position);
    inst.position.copy(balloon.position); trail.position.copy(balloon.position);
    meMesh.lookAt(camera.position);   // 얼굴이 늘 보는 사람 쪽을 향하게

    const inV = view === 'in';
    $('flash').style.opacity = inV ? flash * 0.8 : flash * 0.25;
    const kk = $('kung');
    guideT += dt; if (inV && guideT > 3.5) $('guide').style.opacity = 0;   // 안내는 잠깐만 보여 주고 사라짐
    if (kungT < 0.5) { kk.style.opacity = (1 - kungT / 0.5) * (inV ? 0.9 : 0.6); kk.style.transform = `translate(-50%,-50%) scale(${0.85 + kungT * 0.5})`; kk.style.fontSize = inV ? '' : 'clamp(20px,2.6vw,36px)'; }
    else kk.style.opacity = 0;

    const h = buckets.reduce((a, b) => a + b, 0); hitShown += (h - hitShown) * 0.1;
    $('hH').textContent = elapsed < 1 ? '–' : Math.round(hitShown);
    $('hMe').textContent = myHits;
    $('hV').textContent = '×' + Math.pow(Rc / R, 3).toFixed(1);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ---------- 조작 ----------
  $('photo').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { buildMe(img); URL.revokeObjectURL(url); };
    img.src = url; e.target.value = '';
  });
  $('defFace').addEventListener('click', () => buildMe(null));
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    view = b.dataset.view;
    document.querySelectorAll('.seg button').forEach(o => o.setAttribute('aria-pressed', o === b));
    applyMaterial();
  }));
  $('see').addEventListener('click', e => { seeThrough = !seeThrough; e.currentTarget.setAttribute('aria-pressed', seeThrough); applyMaterial(); });
  $('force').addEventListener('click', e => { showForce = !showForce; e.currentTarget.setAttribute('aria-pressed', showForce); e.currentTarget.textContent = showForce ? '힘 선 켜짐' : '힘 선 꺼짐'; });
  $('sound').addEventListener('click', e => {
    soundOn = !soundOn;
    if (soundOn && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { soundOn = false; } }
    if (actx && actx.state === 'suspended') actx.resume();
    e.currentTarget.setAttribute('aria-pressed', soundOn); e.currentTarget.textContent = soundOn ? '🔊 소리 켬' : '🔈 소리 끔';
  });
  $('play').addEventListener('click', e => { running = !running; e.currentTarget.textContent = running ? '⏸ 멈춤' : '▶ 재생'; });
  $('full').addEventListener('click', () => {
    try { const p = document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  });
  $('n').addEventListener('input', e => { N = +e.target.value; $('nv').textContent = N + '개'; $('hN').textContent = N + 1; setN(N); });
  $('t').addEventListener('input', e => { const i = +e.target.value; $('tv').textContent = TNAMES[i]; setT(TEMPS[i]); });

  // ---------- 셀카 (기기 안에서만 처리, 저장·전송 없음) ----------
  let stream = null, counting = false;
  async function openCam() {
    $('cam').hidden = false; $('camMsg').textContent = ''; $('count').textContent = ''; $('shoot').disabled = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
      const v = $('camVideo'); v.srcObject = stream; await v.play(); $('shoot').disabled = false;
    } catch (err) {
      $('camMsg').textContent = '카메라를 켤 수 없어요. 카메라 허용을 눌렀는지 확인하거나 "사진 고르기"를 써 주세요.';
    }
  }
  function closeCam() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    $('camVideo').srcObject = null; $('cam').hidden = true; counting = false;
  }
  function shoot() {
    if (counting || !stream) return; counting = true; $('shoot').disabled = true;
    let n = 3; $('count').textContent = n;
    const timer = setInterval(() => {
      n--;
      if (n > 0) { $('count').textContent = n; return; }
      clearInterval(timer);
      const v = $('camVideo'), c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      const g = c.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(v, 0, 0);   // 미리보기와 같은 좌우 방향
      buildMe(c); closeCam();
    }, 1000);
  }
  $('camBtn').addEventListener('click', openCam);
  $('camClose').addEventListener('click', closeCam);
  $('shoot').addEventListener('click', shoot);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('cam').hidden) closeCam(); });
  window.addEventListener('pagehide', closeCam);

  if (!running) $('play').textContent = '▶ 재생';
  resize(); applyMaterial();
  requestAnimationFrame(frame);
})();
</script>

</body>
